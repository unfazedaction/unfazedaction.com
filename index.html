<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unfazed Action</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #050505;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        main {
            width: min(900px, 90%);
            text-align: center;
        }

        .accent {
            width: 70px;
            height: 5px;
            margin: 0 auto 32px;
            background: #E50914;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.8rem, 8vw, 5.5rem);
            letter-spacing: -3px;
        }

        .tagline {
            margin-top: 18px;
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            color: #bdbdbd;
        }

        .mission {
            max-width: 650px;
            margin: 42px auto 0;
            line-height: 1.7;
            color: #dddddd;
        }

        footer {
            margin-top: 70px;
            color: #777777;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <main>
        <div class="accent"></div>

        <h1>UNFAZED ACTION</h1>

        <div class="tagline">
            Build. Grow. Keep Moving.
        </div>

        <p class="mission">
            Unfazed Action creates tools designed to help people connect
            with their lives, take meaningful action, and become the best
            version of themselves.
        </p>

        <footer>
            © 2026 Unfazed Action
        </footer>
    </main>
</body>
</html>
